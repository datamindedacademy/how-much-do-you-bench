# Bifrost, on 8081, beside the LiteLLM gateway on 4000. Both can be up at once,
# which is the point: the same task through two gateways is the only comparison
# that means anything. See README.md beside this file.

services:
  bifrost:
    image: maximhq/bifrost:latest
    ports:
      - "8081:8080"
    volumes:
      # Bifrost reads config.json out of its app directory and writes config.db
      # and logs.db beside it. The directory is a named volume so those two stay
      # out of the working tree; config.json is bind-mounted read-only on top of
      # it, so the file that is under review is the file the gateway reads.
      - bifrost-data:/app/data
      - ./config.json:/app/data/config.json:ro
      # Your own AWS credentials, so the local gateway signs for Bedrock the same
      # way a deployed one would with its task role. Read-only, and it needs the
      # SSO cache, so run `aws sso login` first.
      - ${HOME}/.aws:/root/.aws:ro
    # The image runs as uid 1000 by design. ~/.aws is 0700 on a Linux host, so
    # that user cannot read the credentials it was just handed -- and the failure
    # arrives as an unsigned request, not as a permission error. Root here, on a
    # laptop, for the same reason the LiteLLM container is root.
    user: "0:0"
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-playground}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      # Must start with sk-bf-: Bifrost only accepts that prefix on Authorization
      # and x-api-key, which are the headers every harness here sends.
      BIFROST_VIRTUAL_KEY: ${BIFROST_VIRTUAL_KEY:-sk-bf-local-dev}

# Config and request logs are SQLite in the app directory. Nothing to provision,
# and no Postgres: virtual keys and their spend are rows in here rather than in a
# database the gateway needs before it will answer /key/generate at all.
volumes:
  bifrost-data:
