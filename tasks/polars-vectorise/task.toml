schema_version = "1.3"
artifacts = []

[task]
name = "hackathon/polars-vectorise"
description = "Replace row-at-a-time python UDFs with polars expressions, under a time budget"
authors = []
keywords = ["polars", "performance", "vectorisation", "data-engineering"]

[metadata]
category = "data-engineering"
difficulty_explanation = """
Nothing here is obscure and nothing is broken: the script is correct, and the only
fault is that it calls back into Python once per row across eight million rows.
The work is recognising that both UDFs are expressible as native expressions -- a
tiered discount as a when/then chain, a campaign prefix as a string split -- and
that a rewrite has to preserve every value exactly.

The budget is wall clock, so a change that is merely tidier does not pass, and the
expected values are recomputed in the verifier rather than taken from the script,
so a transform that got fast by doing less fails on the aggregates and again on an
exact sample.
"""

[verifier]
timeout_sec = 600.0
collect = []

[verifier.env]

[agent]
# Lowered from 900/1200 after measuring four harnesses across the suite: the
# median rollout finished its agent phase in 29s, and a rollout that had spent
# its whole budget had essentially never gone on to pass -- it was a harness
# stuck on one task, not a slow correct answer. The tail is what sets wall
# clock, because the last rollout cannot be parallelised: one timeout held a
# submission at 20/21 for thirteen minutes.
timeout_sec = 300.0

# ponytail: network_mode stays "public" because Harbor's docker egress control
# only engages on Linux hosts, and participants run these tasks on macOS
# laptops. Egress for *scored* runs is restricted on the Linux worker host
# instead, which covers the harness process too. Flip this to
# network_mode = "allowlist" if local runs ever stop needing to work on macOS.

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
os = "linux"
cpus = 2
# Airflow's own imports are heavy before the agent adds anything, and 4096 got
# the container killed with exit 137 on the graded worker.
memory_mb = 6144
mcp_servers = []

[environment.env]

[solution.env]
