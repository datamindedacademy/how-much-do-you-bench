schema_version = "1.3"
artifacts = []

[task]
name = "hackathon/airflow-assets"
description = "Schedule a mart on the asset its producer writes, on Airflow 3"
authors = []
keywords = ["airflow", "assets", "scheduling", "data-engineering"]

[metadata]
category = "data-engineering"
difficulty_explanation = """
Two halves, and the recall half is the trap. Airflow 3 renamed Dataset to Asset
and moved it from airflow.datasets into airflow.sdk, but 3.0 still ships a shim,
so the old API imports and merely warns. Nothing fails loudly. A model whose
training predates the rename will happily leave airflow.datasets in place,
because it parses, and will not know that airflow.sdk.Asset is what replaced it.
Reading the installed package, or asking a docs tool, is what closes it.

The other half is design rather than recall: scheduling the consumer on the
asset instead of on a timer, which is the bug the ticket actually describes.
"""

[verifier]
timeout_sec = 600.0
collect = []

[verifier.env]

[agent]
timeout_sec = 900.0

# ponytail: network_mode stays "public" because Harbor's docker egress control
# only engages on Linux hosts, and participants run these tasks on macOS
# laptops. Egress for *scored* runs is restricted on the Linux worker host
# instead, which covers the harness process too. Flip this to
# network_mode = "allowlist" if local runs ever stop needing to work on macOS.

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
os = "linux"
cpus = 2
# Airflow's own imports are heavy before the agent adds anything, and 4096 got
# the container killed with exit 137 on the graded worker.
memory_mb = 6144
mcp_servers = []

[environment.env]

[solution.env]
