schema_version = "1.3"
artifacts = []

[task]
name = "hackathon/dbt-scd2"
description = "Fix an SCD2 snapshot that invents changes and never closes departures"
authors = []
keywords = ["dbt", "snapshot", "scd2", "data-engineering"]

[metadata]
category = "data-engineering"
difficulty_explanation = """
Diagnosis rather than recall. The symptom is a history where every customer
changes every day, and nothing in the snapshot definition looks wrong -- it
declares a timestamp strategy on a column that genuinely is a timestamp. The
insight is that loaded_at describes the ingest, not the customer, so a full daily
extract makes every row look new. Seeing that means reading the feed and the
history together, not the config alone.

The second symptom points the other way: a customer who leaves the feed stays
current forever, which is the snapshot doing exactly what it was told. Either
deletion handling is accepted, so this half rewards knowing the option exists
rather than knowing which spelling is newest.
"""

[verifier]
timeout_sec = 600.0
collect = []

[verifier.env]

[agent]
# Lowered from 900/1200 after measuring four harnesses across the suite: the
# median rollout finished its agent phase in 29s, and a rollout that had spent
# its whole budget had essentially never gone on to pass -- it was a harness
# stuck on one task, not a slow correct answer. The tail is what sets wall
# clock, because the last rollout cannot be parallelised: one timeout held a
# submission at 20/21 for thirteen minutes.
timeout_sec = 300.0

# ponytail: network_mode stays "public" because Harbor's docker egress control
# only engages on Linux hosts, and participants run these tasks on macOS
# laptops. Egress for *scored* runs is restricted on the Linux worker host
# instead, which covers the harness process too. Flip this to
# network_mode = "allowlist" if local runs ever stop needing to work on macOS.

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
os = "linux"
cpus = 2
# Airflow's own imports are heavy before the agent adds anything, and 4096 got
# the container killed with exit 137 on the graded worker.
memory_mb = 4096
mcp_servers = []

[environment.env]

[solution.env]
